<!DOCTYPE html>

<html>
    <head>
        <title>Projetinho 1</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Projeto de HTML5 + CSS3</h1>
        </header>
        <main>
            <fieldset>
                <div>
                    <section>
                            <h2><em>Tela de Login</em></h2>
                                <form>
                                    <h3>Nome de usuario</h3>
                                    <input type="text" id="nu" name="usuario" placeholder="Digite aqui o seu nome de usuario">
                                </form>
                    </section> 
                    <section>
                            <form>
                                <h3>Digite seu email</h3>
                                <input type="email" id="e" name="email" placeholder="Digite seu email">
                            </form>
                    </section>
                    <section>
                            <form>
                                <h3>Qual tipo de email voce usa</h3>
                                    <input type="radio" id="p1" name="pergunta_email" value="Pessoal">
                                    <label for="p1">Email pessoal</label>
                                    <input type="radio" id="p2" name="pergunta_email" value="Empressarial">
                                    <label for="p2">Empressarial</label>
                            </form>
                    </section>
                    <section>
                            <form>
                                <h3>Nao esqueça da sua senha ;)</h3>
                                <input type="password" id="ps" name="senha" placeholder="Digite sua senha">
                            </form>
                    </section>   
                    <section>
                            <input type="submit" id="s" name="submit" placeholder="ENTRAR">
                    </section>
            </div>
            </fieldset>
        </main>
    </body>
</html>
